name: Refresh community events

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check files and run collector
        run: |
          pwd
          ls -la
          ls -la scripts
          python scripts/update_events.py

      - name: Commit updated events
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Refresh NPT Radio events'
          file_pattern: events-feed.json
