name: Refresh community events

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npt-events-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run event collector
        run: python scripts/update_events.py

      - name: Commit and push events safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add events-feed.json

          if git diff --cached --quiet; then
            echo "No event changes to publish."
            exit 0
          fi

          git commit -m "Refresh NPT Radio events"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict: manual review needed."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Events published successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying."
          done

          exit 1
