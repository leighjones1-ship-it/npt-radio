
name: Update NPT Radio Traffic

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npt-radio-traffic
  cancel-in-progress: false

jobs:
  update-traffic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update traffic information
        run: python .github/workflows/update_traffic.py

      - name: Save traffic updates
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add traffic-feed.json

          if git diff --cached --quiet; then
            echo "No traffic changes to publish"
            exit 0
          fi

          git commit -m "Refresh NPT Radio traffic"

          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Traffic updates published"
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Traffic update conflict"
              exit 1
            fi

            sleep 5
          done

          echo "Unable to publish traffic updates"
          exit 1
