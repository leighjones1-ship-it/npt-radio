name: Update NPT Radio Traffic

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-traffic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update traffic information
        run: python update_traffic.py

      - name: Save traffic updates
        run: |          if ! git diff --cached --quiet; then
            git commit -m "Refresh NPT Radio traffic"
            git pull --rebase origin main
            git push origin HEAD:main
          fi          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic-feed.json
       
